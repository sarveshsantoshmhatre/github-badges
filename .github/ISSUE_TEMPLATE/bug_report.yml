name: Documentation or link issue
description: Report an incorrect claim, unclear guidance, or broken link.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping keep the GitHub achievements guide accurate."
  - type: textarea
    id: problem
    attributes:
      label: What needs correction?
      description: Describe the inaccurate statement, unclear section, or broken link.
      placeholder: Include the page or section and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or source
      description: Link official GitHub documentation or other reliable evidence.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether this issue already exists.
          required: true
